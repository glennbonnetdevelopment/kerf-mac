name: KerfSender for Windows

on:
  push:
    paths:
      - "senders/windows/**"
      - "senders/samples/**"
      - ".github/workflows/kerfsender-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Self-test (job reader and streaming rules)
        run: dotnet run --project senders/windows/SelfTest -c Release
      - name: Build KerfSender.exe (.NET Framework 4.0, runs on Windows 7 SP1 to 11)
        run: dotnet build senders/windows/KerfSender -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: KerfSender-windows
          path: senders/windows/KerfSender/bin/Release/net40/KerfSender.exe
